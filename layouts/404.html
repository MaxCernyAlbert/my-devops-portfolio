{{ define "main" }}
<div class="min-h-screen flex items-center justify-center px-6">
    <div class="text-center max-w-2xl">
        <div class="mb-8">
            <i class="fa-solid fa-triangle-exclamation text-8xl text-yellow-500 mb-6"></i>
            <h1 class="text-7xl font-extrabold mb-4">
                <span class="gradient-text">404</span>
            </h1>
            <h2 class="text-3xl font-bold text-white mb-4">Page Not Found</h2>
            <p class="text-gray-400 text-lg mb-8">
                The page you're looking for doesn't exist or has been moved.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{{ site.BaseURL }}" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded transition">
                <i class="fa-solid fa-home mr-2"></i> Go to Homepage
            </a>
            <a href="{{ site.BaseURL }}#contact" class="px-6 py-3 border border-gray-700 hover:border-gray-600 text-gray-300 hover:text-white font-bold rounded transition">
                <i class="fa-solid fa-envelope mr-2"></i> Contact Me
            </a>
        </div>

        <div class="mt-12 p-6 bg-gray-800/50 rounded-lg border border-gray-700">
            <p class="text-sm text-gray-400 font-mono">
                <i class="fa-solid fa-lightbulb text-yellow-500 mr-2"></i>
                Looking for case studies? Check out my <a href="{{ site.BaseURL }}#work" class="text-blue-400 hover:text-blue-300 underline">work portfolio</a> or view <a href="{{ site.BaseURL }}#services" class="text-blue-400 hover:text-blue-300 underline">services</a>.
            </p>
        </div>
    </div>
</div>
{{ end }}
