{{ define "main" }}
<section class="pt-32 pb-20 px-6 bg-[#0B0F19]">
    <div class="max-w-4xl mx-auto">
        <a href="{{ site.BaseURL }}#work" class="text-blue-500 hover:text-white mb-8 inline-block font-mono text-sm">&larr; Back to Overview</a>

        <h1 class="text-3xl md:text-5xl font-bold text-white mb-6">{{ .Title }}</h1>

        <div class="flex flex-wrap gap-2 mb-8 font-mono text-xs text-gray-400">
            {{ range .Params.tags }}
                <span class="bg-gray-800 border border-gray-700 px-3 py-1 rounded">{{ . }}</span>
            {{ end }}
        </div>

        <article class="prose prose-invert prose-lg max-w-none border-t border-gray-800 pt-8">
            {{ .Content }}
        </article>

        <div class="mt-12 pt-12 border-t border-gray-800 text-center">
            <h3 class="text-2xl font-bold text-white mb-4">Need similar results?</h3>
            <a href="mailto:email@example.com" class="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded inline-block">Book an Audit</a>
        </div>

    </div>
</section>
{{ end }}
