<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F19"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#3b82f6" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#3b82f6" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#3b82f6" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#3b82f6" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#3b82f6" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#3b82f6" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#3b82f6" stroke-width="1"/>
  </g>

  <!-- Terminal icon -->
  <g transform="translate(100, 200)">
    <rect width="80" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M20 30l15 15-15 15" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="40" y1="55" x2="60" y2="55" stroke="url(#blueGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="200" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white">MAXINTHECLOUD</text>
  <text x="200" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="url(#blueGrad)">DEVOPS.ARCHITECT</text>

  <!-- Description -->
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#94a3b8">Senior Azure DevOps Consultant &amp; Cloud Architect</text>
  <text x="100" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748b">20+ Years Enterprise Experience | Azure Landing Zones | Terraform | IaC</text>

  <!-- Tech badges -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="100" height="36" rx="6" fill="#1e40af" opacity="0.3"/>
    <text x="50" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">Azure</text>

    <rect x="120" y="0" width="120" height="36" rx="6" fill="#7c3aed" opacity="0.3"/>
    <text x="180" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#a78bfa" text-anchor="middle">Terraform</text>

    <rect x="260" y="0" width="150" height="36" rx="6" fill="#059669" opacity="0.3"/>
    <text x="335" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#34d399" text-anchor="middle">GitHub Actions</text>

    <rect x="430" y="0" width="80" height="36" rx="6" fill="#0891b2" opacity="0.3"/>
    <text x="470" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#22d3ee" text-anchor="middle">Bicep</text>

    <rect x="530" y="0" width="140" height="36" rx="6" fill="#dc2626" opacity="0.3"/>
    <text x="600" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#f87171" text-anchor="middle">DevSecOps</text>
  </g>

  <!-- URL -->
  <text x="100" y="580" font-family="monospace" font-size="20" fill="#475569">maxinthecloud.com</text>

  <!-- Decorative corner -->
  <path d="M1100 0 L1200 0 L1200 100" stroke="url(#blueGrad)" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M0 530 L0 630 L100 630" stroke="url(#blueGrad)" stroke-width="4" fill="none" opacity="0.5"/>
</svg>
